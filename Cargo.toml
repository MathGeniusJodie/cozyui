[package]
name = "cozyui"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
deunicode = "1"
memmap2 = "0.9"
phf = { version = "0.11", features = ["macros"] }
pixel-fonts = { path = "../pixel-fonts" }
pixel-graphics = { path = "../pixel-graphics" }
serde_json = "1"
x11rb = { version = "0.13", features = ["allow-unsafe-code", "shm", "shape"] }
xkbcommon = { version = "0.8", default-features = false, features = ["x11"] }
